<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Perfiles UI Reactiva</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Contenedor Principal de la SPA -->
    <div id="app">
        <!-- Navegación Superior -->
        <header class="navbar">
            <h1 class="brand">Generador de Perfiles UI Reactiva</h1>
            <nav id="main-nav">
                <a href="#/login" class="nav-link active">Iniciar sesión</a>
                <a href="#/crear" id="nav-crear" class="nav-link" style="display: none;">Crear Perfil</a>
                <a href="#/galeria" id="nav-galeria" class="nav-link" style="display: none;">Galería</a>
                <a href="#" id="nav-logout" class="nav-link" style="display: none;">Cerrar sesión</a>
            </nav>
        </header>
        <!-- Contenedor Dinámico: Aquí controlamos las vistas -->
        <main id="router-view">
            <!-- ========================================== -->
            <!-- VISTA 0: MÓDULO DE AUTENTICACIÓN (migrado SP2-2) -->
            <!-- ========================================== -->
            <div id="view-auth" class="view-module active">
                <div class="auth-container">

                    <!--Pestañas de navegacion-->
                    <div class="auth-tabs">
                        <button type="button" id="tab-login" class="auth-tab active">Iniciar sesión</button>
                        <button type="button" id="tab-register" class="auth-tab">Registrarse</button>
                    </div>

                    <!--Formulario de Login (Por defecto)-->
                    <form id="form-login" class="auth-form active">
                        <h2 style="margin-bottom: 1.5rem; text-align: center;">Bienvenido de nuevo!</h2>
                        <div class="input-group">
                            <label for="login-email">Correo electrónico</label>
                            <input type="email" id="login-email" name="email" required placeholder="correo@ejemplo.com">
                        </div>
                        <div class="input-group">
                            <label for="login-password">Contraseña</label>
                            <input type="password" id="login-password" name="password" required placeholder="********">
                        </div>
                        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Ingresar</button>
                    </form>

                    <!--Formulario de Registro-->
                    <form id="form-registro" class="auth-form" style="display: none;">
                        <h2 style="margin-bottom: 1.5rem; text-align: center;">Registro de perfil</h2>

                        <div class="input-group">
                            <label for="nombre">Nombre Completo</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej. Hector Sanchez" required>
                        </div>

                        <div class="input-group-row">
                            <div class="input-group">
                                <label for="nacimiento">Fecha de Nacimiento</label>
                                <input type="date" id="nacimiento" name="nacimiento" required>
                            </div>
                            <div class="input-group">
                                <label for="educacion">Nivel Educativo</label>
                                <select id="educacion" name="educacion" required class="form-select">
                                    <option value="">Seleccione uno...</option>
                                    <option value="preparatoria">Preparatoria</option>
                                    <option value="ingenieria">Ingenieria</option>
                                    <option value="maestria">Maestria</option>
                                    <option value="doctorado">Doctorado</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" required>
                        </div>
                        <div class="input-group-row">
                            <div class="input-group">
                                <label for="horas">Horas al dia programando</label>
                                <input type="number" id="horas" name="horas" min="0" max="24" step="0.5" required>
                            </div>
                            <div class="input-group">
                                <label for="email">Correo Electrónico</label>
                                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="input-group-row">
                            <div class="input-group">
                                <label for="nickname">Nickname</label>
                                <input type="text" id="nickname" name="nickname" required>
                            </div>
                            <div class="input-group">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Registrar Información</button>
                    </form>

                </div>
            </div>

            <!-- ========================================== -->
            <!-- MÓDULO DE CREACIÓN DE PERFIL      -->
            <!-- ========================================== -->
            <div id="view-create" class="view-module active">
                <div class="view-create-profile">

                    <!-- Panel Izquierdo: Controles y Formularios -->
                    <section class="form-container">
                        <h2>Diseña tu Perfil</h2>

                        <div class="api-search-block">
                            <label for="github-search">Autocompletar desde GitHub</label>
                            <div class="input-group-row">
                                <input type="text" id="github-search" placeholder="Usuario (Ej. octocat)">
                                <button type="button" id="btn-fetch" class="btn-secondary">Buscar</button>
                            </div>
                            <span id="api-status" class="status-msg"></span>
                        </div>
                        <hr>


                        <!-- Entrada Manual -->
                        <form id="profile-form">
                            <!-- Selector de Avatares -->
                            <div class="input-group">
                                <label>Elige un Avatar</label>
                                <div id="avatar-selector" class="avatar-grid">
                                    <!-- Los avatares se inyectarán aquí con JavaScript -->
                                </div>
                            </div>
                            <div class="input-group">
                                <label for="input-name">Nombre a mostrar</label>
                                <input type="text" id="input-name" placeholder="Tu Nombre">
                            </div>

                            <div class="input-group">
                                <label for="input-bio">Biografía</label>
                                <textarea id="input-bio" rows="3" placeholder="Cuéntanos sobre ti..."></textarea>
                            </div>

                            <div class="input-group">
                                <label for="input-color">Color de acento</label>
                                <input type="color" id="input-color" value="#3b82f6">
                            </div>

                            <button type="submit" class="btn-primary">Guardar Tarjeta</button>
                        </form>
                    </section>

                    <!-- Panel Derecho: Previsualización en Tiempo Real -->
                    <section class="card-container">
                        <article id="profile-card" class="card">
                            <div class="card-header" id="preview-header"></div>
                            <img id="avatar-preview" src="src/assets/Avatar0.jpg" alt="Avatar" class="avatar">
                            <div class="card-body">
                                <h3 id="name-preview">Nombre Apellido</h3>
                                <p id="bio-preview">La biografía aparecerá aquí...</p>
                            </div>
                        </article>
                    </section>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- VISTA 2: MÓDULO DE GALERÍA                 -->
            <!-- ========================================== -->
            <div id="view-gallery" class="view-module" style="display: none;">
                <div class="gallery-header">
                    <h2>Perfiles Guardados</h2>
                    <button id="btn-reload-gallery" class="btn-secondary">Actualizar Galería</button>
                </div>
                <!-- Aquí JavaScript inyectará todas las tarjetas guardadas en el JSON -->
                <div id="gallery-container" class="gallery-grid">
                    <p class="status-msg status-loading">Cargando tarjetas...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de lógica -->
    <script src="js/app.js"></script>
</body>
</html>
